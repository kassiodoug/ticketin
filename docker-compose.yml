services:
  # FRONTEND - NEXT.JS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

    depends_on:
      - backend

    networks:
      - frontend_network

  # BACKEND - EXPRESS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "3333:3333"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticketin

    depends_on:
      postgres:
        condition: service_healthy

    # command: >
    #   sh -c "
    #     npm run migrate &&
    #     npm run seed
    #   "

    networks:
      - frontend_network
      - backend_network

  # DATABASE - POSTGRESQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketin

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - backend_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketin"]
      interval: 5s
      timeout: 5s
      retries: 10

# NETWORKS
networks:
  frontend_network:
    driver: bridge

  backend_network:
    driver: bridge
    internal: true

# VOLUMES
volumes:
  pgdata:
